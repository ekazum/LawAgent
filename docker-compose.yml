services:
  db:
    image: pgvector/pgvector:pg17
    container_name: lawagent-db
    environment:
      POSTGRES_USER: lawagent
      POSTGRES_PASSWORD: lawagent
      POSTGRES_DB: lawagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawagent -d lawagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: lawagent-app
    environment:
      DATABASE_URL: postgresql://lawagent:lawagent@db:5432/lawagent
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
